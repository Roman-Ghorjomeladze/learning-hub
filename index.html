<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Learning Hub</title>
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='17' width='12' height='10' fill='%231D63ED'/%3E%3Crect x='17' y='17' width='12' height='10' fill='%23326CE5'/%3E%3Crect x='10' y='5' width='12' height='10' fill='%237B42BC'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="app/styles.css">
  <script>
    window.Prism = { manual: true };
    try { const t = JSON.parse(localStorage.getItem('learning-hub:v1') || '{}').theme; if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="shell">
    <header class="topbar">
      <button class="icon-btn menu-btn" type="button" aria-label="Open navigation" aria-expanded="false" data-action="toggle-nav">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" fill="none"/></svg>
      </button>
      <a class="brand" href="#/"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span class="brand-name">Learning Hub</span></a>
      <button class="search-trigger" type="button" data-action="open-search"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2"/></svg><span>Search</span><kbd>/</kbd></button>
    </header>
    <nav class="sidebar" id="sidebar" aria-label="Main"></nav>
    <div class="scrim" data-action="toggle-nav"></div>
    <main id="main" tabindex="-1"></main>
  </div>

  <div class="search" id="search" hidden role="dialog" aria-modal="true" aria-label="Search">
    <div class="search-panel">
      <input id="search-input" type="search" placeholder="Search lessons, labs, cards…" autocomplete="off" spellcheck="false">
      <div class="search-results" id="search-results" role="listbox"></div>
      <div class="search-foot"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>Enter</kbd> open</span><span><kbd>Esc</kbd> close</span></div>
    </div>
  </div>

  <noscript>This app needs JavaScript enabled.</noscript>
  <script src="app/vendor/prism.js"></script>
  <script src="dist/content.js"></script>
  <script src="app/app.js"></script>
</body>
</html>
